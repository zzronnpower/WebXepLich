services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - WATCHFILES_FORCE_POLLING=true
      - CO_SO_DU_LIEU_URL=postgresql+psycopg2://lich_user:lich_pass@db:5432/lich_lam_viec
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=lich_user
      - POSTGRES_PASSWORD=lich_pass
      - POSTGRES_DB=lich_lam_viec
    ports:
      - "5432:5432"
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data

volumes:
  du_lieu_postgres:
