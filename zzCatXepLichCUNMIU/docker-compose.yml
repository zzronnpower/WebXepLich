services:
  web:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - CO_SO_DU_LIEU_URL=postgresql+psycopg2://lich_user:lich_pass@db:5432/lich_lam_viec
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=lich_user
      - POSTGRES_PASSWORD=lich_pass
      - POSTGRES_DB=lich_lam_viec
    ports:
      - "5432:5432"
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lich_user -d lich_lam_viec"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  du_lieu_postgres:
