{% extends "base.html" %}
{% block noi_dung %}
  <section class="khung">
    <div class="tieu-de-hang">
      <h2>Nhu cầu ca</h2>
    </div>
    <div class="luoi-2">
      <form class="the" action="/nhu-cau-ca" method="post">
        <h3>Thêm nhu cầu</h3>
        <label>Ngày</label>
        <input type="date" name="ngay" required />
        <label>Chi nhánh</label>
        <select name="chi_nhanh_id">
          <option value="">Không chọn</option>
          {% for cn in ds_chi_nhanh %}
            <option value="{{ cn.id }}">{{ cn.ten_chi_nhanh }}</option>
          {% endfor %}
        </select>
        <label>Ca</label>
        <select name="ca_id" required>
          {% for ca in ds_ca %}
            <option value="{{ ca.id }}">{{ ca.ten_ca }}</option>
          {% endfor %}
        </select>
        <label>Số người cần</label>
        <input type="number" name="so_nguoi_can" value="1" required />
        <label>Vai trò yêu cầu</label>
        <select name="vai_tro_yeu_cau_id">
          <option value="">Không chọn</option>
          {% for vt in ds_vai_tro %}
            <option value="{{ vt.id }}">{{ vt.ten_vai_tro }}</option>
          {% endfor %}
        </select>
        <label>Độ quan trọng (1-5)</label>
        <input type="number" name="do_quan_trong" min="1" max="5" />
        <label>Senior tối thiểu</label>
        <input type="number" name="senior_toi_thieu" min="0" />
        <button class="nut-chinh" type="submit">Thêm</button>
      </form>
      <div class="the">
        <h3>Danh sách</h3>
        <table class="bang-nho">
          <thead>
            <tr>
              <th>Ngày</th>
              <th>Chi nhánh</th>
              <th>Ca</th>
              <th>Số người</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {% for nc in ds_nhu_cau %}
              <tr>
                <td>{{ nc.ngay }}</td>
                <td>{{ nc.chi_nhanh.ten_chi_nhanh if nc.chi_nhanh else "-" }}</td>
                <td>{{ nc.ca_lam.ten_ca }}</td>
                <td>{{ nc.so_nguoi_can }}</td>
                <td>
                  <form action="/nhu-cau-ca/{{ nc.id }}/xoa" method="post">
                    <button class="nut-phu" type="submit">Xóa</button>
                  </form>
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </section>
{% endblock %}
