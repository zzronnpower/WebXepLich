{% extends "base.html" %}
{% block noi_dung %}
  <section class="khung">
    <div class="tieu-de-hang">
      <h2>Trọng số ưu tiên</h2>
    </div>
    <div class="luoi-2">
      <form class="the" action="/trong-so" method="post">
        <h3>Cập nhật trọng số</h3>
        <label>Khóa</label>
        <input name="khoa" placeholder="Ưu tiên ca ưa thích" required />
        <label>Giá trị</label>
        <select name="gia_tri" required>
          {% for v in range(1, 6) %}
            <option value="{{ v }}">{{ v }}</option>
          {% endfor %}
          <option value="7">Top</option>
        </select>
        <button class="nut-chinh" type="submit">Lưu</button>
      </form>
      <div class="the">
        <h3>Danh sách</h3>
        <table class="bang-nho">
          <thead>
            <tr>
              <th>Khóa</th>
              <th>Giá trị</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {% for ts in ds_trong_so %}
              <tr>
                <td>{{ ten_trong_so_hien_thi(ts.khoa) }}</td>
                <td>
                  <form class="form-hang" action="/trong-so" method="post">
                    <input type="hidden" name="khoa" value="{{ ts.khoa }}" />
                    <select name="gia_tri">
                      {% for v in range(1, 6) %}
                        <option value="{{ v }}" {% if v == ts.gia_tri %}selected{% endif %}>{{ v }}</option>
                      {% endfor %}
                      <option value="7" {% if ts.gia_tri == 7 %}selected{% endif %}>Top</option>
                    </select>
                    <button class="nut-phu" type="submit">Lưu</button>
                  </form>
                </td>
                <td>
                  <form action="/trong-so/{{ ts.id }}/xoa" method="post">
                    <button class="nut-phu" type="submit">Xóa</button>
                  </form>
                </td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </section>
{% endblock %}
